name: dokploy-all-in-one
version: 1.0.0

registry:
  username: ${DOKPLOY_USERNAME}
  password: ${DOKPLOY_PASSWORD}

build:
  dockerfile_path: ./docker-compose.yml
  context: ./

containers:
  - name: static-website
    image: dokploy-static
    port: 80
    is_expose: false

  - name: nextjs-app
    image: dokploy-nextjs
    port: 3000
    is_expose: false

  - name: express-api
    image: dokploy-express
    port: 3000
    is_expose: false
    env:
      - name: DATABASE_URL
        value: ${POSTGRES_URL}

  - name: fastapi
    image: dokploy-fastapi
    port: 8000
    is_expose: false
    env:
      - name: MONGODB_URL
        value: ${MONGODB_URL}

  - name: worker
    image: dokploy-worker
    is_expose: false
    env:
      - name: REDIS_URL
        value: ${REDIS_URL}

health_check:
  enabled: true
  path: /
  port: 80

resources:
  memory_limit: 2G
  memory_request: 1G
  cpu_limit: 2
  cpu_request: 1

replicas:
  min: 1
  max: 2

databases:
  - name: postgres_db
    type: postgresql
    default: true
  - name: mongodb
    type: mongodb
  - name: redis
    type: redis