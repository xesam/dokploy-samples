name: dokploy-fastapi-mongodb
version: 1.0.0

registry:
  username: ${DOKPLOY_USERNAME}
  password: ${DOKPLOY_PASSWORD}

build:
  dockerfile_path: ./Dockerfile
  context: ./

containers:
  - name: api
    image: dokploy-fastapi-mongodb
    port: 8000
    is_expose: true
    gpu_enabled: false
    env:
      - name: MONGODB_URL
        value: ${MONGODB_URL}
      - name: DATABASE_NAME
        value: dokploy_fastapi
      - name: PORT
        value: "8000"

domains:
  - name: fastapi.example.com
    https: true
    port: 8000
    only_https: false

health_check:
  enabled: true
  path: /health
  port: 8000

resources:
  memory_limit: 512M
  memory_request: 256M
  cpu_limit: 1
  cpu_request: 0.5

replicas:
  min: 1
  max: 3

databases:
  - name: mongodb
    type: mongodb
    default: true