name: dokploy-nextjs-app
version: 1.0.0

registry:
  username: ${DOKPLOY_USERNAME}
  password: ${DOKPLOY_PASSWORD}

build:
  dockerfile_path: ./Dockerfile
  context: ./

containers:
  - name: web
    image: dokploy-nextjs-app
    port: 3000
    is_expose: true
    gpu_enabled: false
    env:
      - name: APP_ENV
        value: production
      - name: NEXT_PUBLIC_VERSION
        value: "1.0.0"

domains:
  - name: nextjs.example.com
    https: true
    port: 3000
    only_https: false

health_check:
  enabled: true
  path: /
  port: 3000

resources:
  memory_limit: 512M
  memory_request: 256M
  cpu_limit: 1
  cpu_request: 0.5

replicas:
  min: 1
  max: 3