name: dokploy-express-postgres
version: 1.0.0

registry:
  username: ${DOKPLOY_USERNAME}
  password: ${DOKPLOY_PASSWORD}

build:
  dockerfile_path: ./Dockerfile
  context: ./

containers:
  - name: api
    image: dokploy-express-postgres
    port: 3000
    is_expose: true
    gpu_enabled: false
    env:
      - name: NODE_ENV
        value: production
      - name: DATABASE_URL
        value: ${POSTGRES_URL}
      - name: PORT
        value: "3000"

domains:
  - name: api.example.com
    https: true
    port: 3000
    only_https: false

health_check:
  enabled: true
  path: /api/health
  port: 3000

resources:
  memory_limit: 512M
  memory_request: 256M
  cpu_limit: 1
  cpu_request: 0.5

replicas:
  min: 1
  max: 3

databases:
  - name: postgres_db
    type: postgresql
    default: true