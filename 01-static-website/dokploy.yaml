name: dokploy-static-website
version: 1.0.0

registry:
  username: ${DOKPLOY_USERNAME}
  password: ${DOKPLOY_PASSWORD}

build:
  dockerfile_path: ./Dockerfile
  context: ./

containers:
  - name: web
    image: dokploy-static-website
    port: 80
    is_expose: true
    gpu_enabled: false

domains:
  - name: static.example.com
    https: true
    port: 80
    only_https: false

health_check:
  enabled: true
  path: /
  port: 80

resources:
  memory_limit: 128M
  memory_request: 64M
  cpu_limit: 0.5
  cpu_request: 0.25

replicas:
  min: 1
  max: 3